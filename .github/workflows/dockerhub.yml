name: Publicar imagens no Docker Hub

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'App/**'
      - '.github/workflows/dockerhub.yml'
  pull_request:
    branches: [main]
    paths:
      - 'App/**'
      - '.github/workflows/dockerhub.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Imagem ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: db
            context: ./App/database
            image: felipenagai/estoque-lsvp-db
          - service: backend
            context: ./App/backend/InventoryManagement
            image: felipenagai/estoque-lsvp-backend
          - service: frontend
            context: ./App/frontend/Estoque_WebApp
            image: felipenagai/estoque-lsvp-frontend

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar no Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: felipenagai
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Gerar tags e labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long

      - name: Compilar e publicar
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
